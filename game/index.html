<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1b2e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch controls: hidden unless the device actually has touch, so desktop
     play and the deterministic screenshots stay clean. */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }
  #stick {
    position: fixed; left: 18px; bottom: 18px; z-index: 10;
    width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25);
    touch-action: none;
  }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5);
  }
  #touch-buttons {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    touch-action: none;
  }
  .tbtn-row { display: flex; gap: 10px; align-items: flex-end; }
  .tbtn {
    width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(13,27,46,.55);
    color: #fff; font: 700 11px/1.1 system-ui, sans-serif; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn:active { background: rgba(255,255,255,.35); }
  #btn-fire { width: 72px; height: 72px; background: rgba(200,40,60,.6); font-size: 12px; }
  #zoom-buttons {
    position: fixed; left: 12px; top: 50%; z-index: 10;
    display: none; flex-direction: column; gap: 10px;
    transform: translateY(-50%); touch-action: none;
  }
  body.touch #zoom-buttons { display: flex; }
  #zoom-buttons .tbtn { width: 44px; height: 44px; font-size: 20px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Explore the city on foot or by car, steal cars, outrun the police, and finish story jobs to clear Rex Marlowe's debt."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touch-ui" aria-hidden="true">
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="zoom-buttons">
    <button class="tbtn" id="btn-zoom-in" type="button">+</button>
    <button class="tbtn" id="btn-zoom-out" type="button">−</button>
  </div>
  <div id="touch-buttons">
    <div class="tbtn-row">
      <button class="tbtn" id="btn-mission" type="button">MISI</button>
      <button class="tbtn" id="btn-punch" type="button">PUKUL</button>
      <button class="tbtn" id="btn-pause" type="button">JEDA</button>
    </div>
    <div class="tbtn-row">
      <button class="tbtn" id="btn-sprint" type="button">LARI</button>
      <button class="tbtn" id="btn-enter" type="button">MASUK</button>
      <button class="tbtn" id="btn-fire" type="button">TEMBAK</button>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
